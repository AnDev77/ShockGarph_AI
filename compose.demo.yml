services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SHOCKGRAPH_SERVICE_MODE: demo
    expose:
      - "8000"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      SHOCKGRAPH_API_URL: http://api:8000
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${SHOCKGRAPH_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
