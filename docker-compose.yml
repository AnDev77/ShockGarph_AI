services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shockgraph
      POSTGRES_USER: shockgraph
      POSTGRES_PASSWORD: shockgraph
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shockgraph -d shockgraph"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - shockgraph_pgdata:/var/lib/postgresql/data

volumes:
  shockgraph_pgdata:

