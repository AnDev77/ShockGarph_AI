name: 빌드와 품질 게이트

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shockgraph_test
          POSTGRES_USER: shockgraph_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shockgraph_test -d shockgraph_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 개발 의존성 설치
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev,viz]' build
      - name: 배포 패키지 빌드
        run: .venv/bin/python -m build --wheel --outdir dist
      - name: 빌드 산출물 검사
        run: .venv/bin/python scripts/check_wheel_contents.py dist/*.whl
      - name: 정적 검사
        run: make quality PYTHON=.venv/bin/python
      - name: 전체 시험
        env:
          SHOCKGRAPH_TEST_POSTGRES_DSN: postgresql://shockgraph_test:local-ci-only@localhost:5432/shockgraph_test
        run: make test PYTHON=.venv/bin/python
