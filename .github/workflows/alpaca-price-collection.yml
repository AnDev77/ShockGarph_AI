name: Alpaca 가격 수집 확인

on:
  push:
    branches:
      - feat/alpaca-price-snapshots
    paths:
      - .github/workflows/alpaca-price-collection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID || secrets.ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY || secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: python -m pip install -e .
      - name: 비밀 변수 연결 확인
        run: |
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ]; then
            echo 'Alpaca 키 ID와 비밀키를 Actions 비밀 변수에 연결해야 합니다.'
            exit 2
          fi
      - name: TLT·SPY 과거 가격 수집과 검증
        run: |
          PRICE_END=$(python -c 'from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo("America/New_York")).date() - timedelta(days=1)).isoformat())')
          if python scripts/collect_alpaca_prices.py --start 2024-01-02 --end "$PRICE_END"; then
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import httpx

          headers = {
              "APCA-API-KEY-ID": os.environ["APCA_API_KEY_ID"],
              "APCA-API-SECRET-KEY": os.environ["APCA_API_SECRET_KEY"],
          }
          with httpx.Client(timeout=15) as client:
              for feed in ("iex", "sip"):
                  try:
                      response = client.get(
                          "https://data.alpaca.markets/v2/stocks/SPY/bars",
                          params={"timeframe": "1Day", "start": "2024-04-08",
                                  "end": "2024-04-09", "feed": feed, "limit": 1},
                          headers=headers,
                      )
                      print(json.dumps({"feed": feed, "http_status": response.status_code}))
                  except httpx.HTTPError:
                      print(json.dumps({"feed": feed, "status": "network_error"}))
          PY
          exit 2
