name: Alpaca 가격 수집 확인

on:
  push:
    branches:
      - feat/alpaca-price-snapshots
    paths:
      - .github/workflows/alpaca-price-collection.yml
      - apps/collector/shockgraph_collector/alpaca_bars.py
      - scripts/collect_alpaca_prices.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID || secrets.ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY || secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: python -m pip install -e .
      - name: 비밀 변수 연결 확인
        run: |
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ]; then
            echo 'Alpaca 키 ID와 비밀키를 Actions 비밀 변수에 연결해야 합니다.'
            exit 2
          fi
      - name: TLT·SPY 과거 가격 수집과 검증
        run: |
          PRICE_END=$(python -c 'from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo("America/New_York")).date() - timedelta(days=1)).isoformat())')
          if python scripts/collect_alpaca_prices.py --start 2024-01-02 --end "$PRICE_END"; then
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import httpx

          headers = {
              "APCA-API-KEY-ID": os.environ["APCA_API_KEY_ID"],
              "APCA-API-SECRET-KEY": os.environ["APCA_API_SECRET_KEY"],
          }
          today_us = datetime.now(ZoneInfo("America/New_York")).date()
          latest = (today_us - timedelta(days=1)).isoformat()
          cases = (
              ("old_small", "sip", "2024-04-08", "2024-04-09", 1),
              ("old_large_limit", "sip", "2024-04-08", "2024-04-09", 10000),
              ("wide_old", "sip", "2024-01-02", "2026-09-30", 1),
              ("recent_small", "sip", latest, today_us.isoformat(), 1),
              ("old_iex", "iex", "2024-04-08", "2024-04-09", 1),
          )
          with httpx.Client(timeout=15) as client:
              for name, feed, start, end, limit in cases:
                  try:
                      response = client.get(
                          "https://data.alpaca.markets/v2/stocks/SPY/bars",
                          params={"timeframe": "1Day", "start": start,
                                  "end": end, "feed": feed, "limit": limit},
                          headers=headers,
                      )
                      payload = response.json() if response.headers.get(
                          "content-type", "").startswith("application/json") else {}
                      code = payload.get("code") if isinstance(payload, dict) else None
                      print(json.dumps({"case": name, "http_status": response.status_code,
                                        "api_code": code if isinstance(code, int) else None}))
                  except httpx.HTTPError:
                      print(json.dumps({"case": name, "status": "network_error"}))
          PY
          exit 2
