name: R2 비공개 가격 빈티지와 사전 위험 보관

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID || secrets.ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY || secrets.ALPACA_API_SECRET_KEY }}
      SHOCKGRAPH_R2_ACCOUNT_ID: ${{ vars.SHOCKGRAPH_R2_ACCOUNT_ID }}
      SHOCKGRAPH_R2_BUCKET: ${{ vars.SHOCKGRAPH_R2_BUCKET }}
      SHOCKGRAPH_R2_ACCESS_KEY_ID: ${{ secrets.SHOCKGRAPH_R2_ACCESS_KEY_ID }}
      SHOCKGRAPH_R2_SECRET_ACCESS_KEY: ${{ secrets.SHOCKGRAPH_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 보관 설정 검사
        run: |
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ] || \
             [ -z "$SHOCKGRAPH_R2_ACCESS_KEY_ID" ] || [ -z "$SHOCKGRAPH_R2_SECRET_ACCESS_KEY" ] || \
             [ -z "$SHOCKGRAPH_R2_ACCOUNT_ID" ] || [ -z "$SHOCKGRAPH_R2_BUCKET" ]; then
            echo '비공개 보관용 변수와 비밀값 구성이 필요합니다.'
            exit 2
          fi
      - name: 보관 의존성 설치
        run: python -m pip install -e '.[archive]'
      - name: 가격 원본 검증과 비공개 보관
        run: |
          PRICE_END=$(python -c 'from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo("America/New_York")).date() - timedelta(days=1)).isoformat())')
          python scripts/collect_alpaca_prices.py --start 2024-01-02 --end "$PRICE_END" > /dev/null
          MANIFEST=$(find artifacts/alpaca-private/captures -maxdepth 1 -type f -name '*.json' -print -quit)
          test -n "$MANIFEST"
          python scripts/archive_forward_capture.py --manifest "$MANIFEST"
