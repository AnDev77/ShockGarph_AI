[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shockgraph-ai"
version = "0.1.0"
description = "Daily market risk and event research MVP"
requires-python = ">=3.12"
dependencies = [
  "httpx[socks]>=0.28,<1",
  "pydantic>=2.10,<3",
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
viz = ["matplotlib>=3.9,<4"]
archive = ["boto3>=1.35,<2"]
database = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools]
packages = [
  "shockgraph_analytics",
  "shockgraph_calibration",
  "shockgraph_collector",
  "shockgraph_data_pipeline",
  "shockgraph_domain",
  "shockgraph_risk",
]

[tool.setuptools.package-dir]
shockgraph_analytics = "packages/event_study/shockgraph_analytics"
shockgraph_calibration = "packages/calibration/shockgraph_calibration"
shockgraph_collector = "apps/collector/shockgraph_collector"
shockgraph_data_pipeline = "packages/data_pipeline/shockgraph_data_pipeline"
shockgraph_domain = "packages/domain/shockgraph_domain"
shockgraph_risk = "packages/risk_engine/shockgraph_risk"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/event_study",
  "apps/collector",
  "packages/calibration",
  "packages/domain",
  "packages/data_pipeline",
  "packages/risk_engine",
]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["apps", "packages", "scripts", "tests"]
extraPaths = [
  "scripts",
  "packages/event_study",
  "apps/collector",
  "packages/calibration",
  "packages/domain",
  "packages/data_pipeline",
  "packages/risk_engine",
]
venvPath = "."
venv = ".venv"
